services:

  cart-service:
    build:
      context: .

    container_name: cart-service

    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://cart_user:cart_password@postgres:5432/cart_db
      REDIS_URL: redis://redis:6379

    depends_on:

      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


    networks:
      - cart-network


    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 30s
      timeout: 5s
      retries: 3



  postgres:

    image: postgres:16-alpine

    container_name: cart-postgres

    restart: unless-stopped


    environment:

      POSTGRES_USER: cart_user
      POSTGRES_PASSWORD: cart_password
      POSTGRES_DB: cart_db


    volumes:

      - postgres-data:/var/lib/postgresql/data


    networks:

      - cart-network


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U cart_user -d cart_db"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



  redis:

    image: redis:7-alpine

    container_name: cart-redis


    restart: unless-stopped


    volumes:

      - redis-data:/data


    networks:

      - cart-network


    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5



volumes:

  postgres-data:

  redis-data:



networks:

  cart-network:

    driver: bridge
